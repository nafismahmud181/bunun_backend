name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Only used to load the Prisma config; tests use a stand-in database.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Export OpenAPI spec
        run: npm run openapi
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: openapi.json

  migrations:
    # Applies every migration to a real PostgreSQL and runs the seed, so a broken migration fails the PR.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bunun
          POSTGRES_PASSWORD: bunun
          POSTGRES_DB: bunun
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bunun" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://bunun:bunun@localhost:5432/bunun?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:deploy
      - run: npm run db:seed
