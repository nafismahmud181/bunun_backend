# Local development services. Start with: docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bunun
      POSTGRES_PASSWORD: bunun
      POSTGRES_DB: bunun
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bunun -d bunun']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
